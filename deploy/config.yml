# ============================================================
# BorderX Panel — 配置文件模板
# ============================================================
# 实际部署时由 install.sh 自动替换密码等敏感项。
# 手动部署请根据你的环境修改以下字段:
#   - database.password
#   - jwt.secret
#   - smtp.* (如需邮件功能)
#   - server_name (Nginx 域名)
# ============================================================

server:
  port: 8080
  mode: release

database:
  host: localhost
  port: 5432
  user: borderx
  password: "CHANGE_ME"
  dbname: borderx
  sslmode: disable

jwt:
  secret: "CHANGE_ME_JWT_SECRET"
  expire_hour: 24

xray:
  config_path: /usr/local/etc/xray/config.json
  stats_port: 10085
  binary_path: /usr/local/bin/xray

smtp:
  host: ""
  port: 587
  username: ""
  password: ""
  from: ""
